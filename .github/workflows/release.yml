name: Release
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  # Drafting a release on the website creates the tag; publishing it fires this
  # and the built assets are attached to that release.
  release:
    types: [published]
  pull_request:
    branches: master
    paths:
    - '**release.yml'

jobs:
  dist:
    runs-on: ubuntu-22.04
    outputs:
      rmw_version: ${{ steps.get_version.outputs.version }}
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: false
    - id: get_version
      run: |
        VERSION=$(grep -m1 -E '^[[:space:]]*version:' meson.build | awk -F"'" '{print $2}')
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "VERSION=$VERSION" >> $GITHUB_ENV
    - name: Install dependencies
      run: |
        sudo apt install -y \
          meson \
          ninja-build \
          xz-utils
    - name:
      run: |
        meson setup builddir
        cd builddir
        meson dist --include-subprojects
        cd meson-dist
        REL_TAR="rmw-$VERSION.tar"
        xz -d "$REL_TAR.xz"
        tar --delete -f "$REL_TAR" "rmw-$VERSION/packaging"
        xz "$REL_TAR"
        sha256sum "$REL_TAR.xz" > "$REL_TAR.xz.sha256sum"
    - name: Upload Artifacts
      uses: actions/upload-artifact@v7
      with:
        name: rmw_dist_archive
        path: ${{ github.workspace }}/builddir/meson-dist/*

  build-appimage:
    name: ${{ matrix.arch }}-appimage
    runs-on: ${{ matrix.runner }}
    needs: dist
    # The AnyLinux method (sharun + uruntime + DwarFS) bundles glibc and the
    # dynamic linker, so the image runs on any distro including musl ones. It
    # is only supported on an Arch Linux base, hence the container. Each
    # matrix leg runs natively on its own runner architecture -- no QEMU.
    container:
      image: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            container: archlinux:latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
            container: lopsided/archlinux:latest

    steps:
      # pacman 7's download sandbox (Landlock + the 'alpm' DownloadUser)
      # cannot be applied inside a CI container: any pacman call that
      # retrieves packages aborts with "switching to sandbox user 'alpm'
      # failed". This also covers the pacman calls quick-sharun makes later.
      - name: Prepare Arch container
        run: |
          sed -i '/^\[options\]/a DisableSandbox' /etc/pacman.conf
          pacman -Syu --noconfirm --needed \
            base-devel \
            git \
            meson \
            ninja \
            gettext \
            glib2 \
            ncurses \
            patchelf \
            wget \
            zsync

      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Set variables
        run: echo "VERSION=${{ needs.dist.outputs.rmw_version }}" >> $GITHUB_ENV

      - name: Build AppImage
        run: packaging/appimage/build-appimage.sh

      - name: Create sha256sum
        run: |
          IMAGE_FILENAME=$(basename `find out/*AppImage`)
          echo "IMAGE_FILENAME=$IMAGE_FILENAME" >> $GITHUB_ENV
          cd out
          sha256sum "$IMAGE_FILENAME" > "$IMAGE_FILENAME.sha256sum"

      - name: Upload AppImage
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.IMAGE_FILENAME }}
          path: ./out/*
          if-no-files-found: error

  build-deb:
    name: ${{ matrix.platform }}-deb
    # Each leg runs on its own architecture. Emulating arm64 breaks anything
    # needing ptrace, which the test suite uses.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: amd64, runner: ubuntu-22.04 }
          - { platform: arm64, runner: ubuntu-22.04-arm }

    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@v7

    - name: Copy debian directory
      run: cp -a packaging/debian .

    - uses: andy5995/gh-action-build-deb@v1
      with:
        args: |
          --no-sign
          --compression=xz
        platform: ${{ matrix.platform }}

    - name: Create sha256sum
      run: |
        DEB_FILENAME=$(basename `find output/*deb`)
        echo "DEB_FILENAME=$DEB_FILENAME" >> $GITHUB_ENV
        cd output
        sha256sum "$DEB_FILENAME" > "$DEB_FILENAME.sha256sum"

    - name: Upload Artifacts
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.DEB_FILENAME }}
        path: output/*
        if-no-files-found: error

  # One job collects everything so the release is updated once, rather than
  # five jobs racing to patch the same release.
  publish:
    name: attach-release-assets
    if: github.event_name == 'release'
    needs:
      - dist
      - build-appimage
      - build-deb
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download the built artifacts
      uses: actions/download-artifact@v8
      with:
        path: assets
        merge-multiple: true

    - run: ls -l assets

    # 'upload' only adds assets, so the title and notes written in the draft
    # cannot be touched. The release already exists -- publishing it is what
    # started this run.
    - name: Attach them to the release
      env:
        GH_TOKEN: ${{ github.token }}
        # gh reads the repo from git otherwise, and this job has no checkout
        GH_REPO: ${{ github.repository }}
        TAG: ${{ github.event.release.tag_name }}
      run: |
        # Name the wanted files rather than globbing: the jobs' artifacts are
        # not all flat, and out/ carries build byproducts that are not assets.
        mapfile -d '' files < <(find assets -type f \( \
          -name '*.tar.xz' -o -name '*.AppImage' -o -name '*.deb' \
          -o -name '*.zsync' -o -name '*.sha256sum' \) -print0)
        printf '%s\n' "${files[@]}"
        gh release upload "$TAG" "${files[@]}" --clobber
