name: Docker rmw Image CI
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'version number'
        required: true
        type: string
        default: 'latest'
  # Publishing a release pushes its version as the image tag. A push filter
  # cannot do this: paths below would apply to the tag push too, and a tag on
  # an existing commit has no matching changes, so it would never fire.
  release:
    types: [published]
  push:
    branches: [ "master" ]
    paths:
      - '.github/workflows/docker.yml'
      - 'docker/Dockerfile'
      - 'src/**'

jobs:
  docker:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Set version
        run: |
          # A dispatch supplies the version; a published release gives it
          # minus the leading 'v'; a push to master refreshes 'latest'.
          if [ -z "$VERSION" ]; then
            if [ -n "$RELEASE_TAG" ]; then
              VERSION="${RELEASE_TAG#v}"
            else
              VERSION=latest
            fi
            echo "VERSION=$VERSION" >> $GITHUB_ENV
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/rmw:${{ env.VERSION }}
