name: C/C++ CI
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

on:
  push:
    branches: master
    paths:
    - '**'
    - '!**.yml'
    - '!**/.github'
    - '!**.md'
    - '!docker/**'
    - '!packaging/**'
    - '!**.txt'
    - '**/c-cpp.yml'
  pull_request:
    branches: master
    paths:
    - '**'
    - '!**.yml'
    - '!**/.github'
    - '!**.md'
    - '!docker/**'
    - '!packaging/**'
    - '!**.txt'
    - '**/c-cpp.yml'

env:
  TERM: xterm
  BTRFS_IMG: test/rmw-btrfs-test.img
  BCACHEFS_IMG: test/rmw-bcachefs-test.img

jobs:
  build:
    name: ${{ matrix.name }}-${{ matrix.os }}-${{ matrix.cc }}
    strategy:
      fail-fast: false
      matrix:
        name: [default]
        os: [ubuntu-22.04, ubuntu-24.04]
        cc: [gcc, clang]
        include:
        - name: Slackware
          os: ubuntu-latest
          container: 'andy5995/slackware-build-essential:15.0'
        - name: Alpine
          os: ubuntu-latest
          container: andy5995/rmw:build-env-alpine
          setup_options: -Db_sanitize=none
        - name: OpenSuse-Tumbleweed
          os: ubuntu-latest
          container: andy5995/rmw:build-env-tumbleweed

    runs-on: ${{ matrix.os }}
    needs:
      - various
    container: ${{ matrix.container }}
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: false

    - name: Set CC
      run: |
        CC=${{ matrix.cc }}
        if [ "$CC" = "gcc" ] || [ -z "$CC" ]; then
          CC=gcc
          CXX=g++
        else
          CC=clang
          CXX=clang++
        fi
        echo "CC=$CC" >> $GITHUB_ENV
        echo "CXX=$CXX" >> $GITHUB_ENV

    - name: Show info
      run: |
        export -p
        echo '${{ toJSON(matrix) }}'

    - if: ${{ matrix.container == null }}
      run: |
        sudo apt update
        sudo apt-get install -y \
          gettext \
          libglib2.0-dev \
          meson \
          ninja-build \
          strace

    - if: ${{ contains(matrix.container, 'alpine') }}
      run: |
        apk update
        apk upgrade

    - if: ${{ contains(matrix.container, 'tumbleweed') }}
      run: |
        zypper --non-interactive refresh
        zypper --non-interactive update

    - name: Configure
      run: meson setup builddir ${SETUP_OPTIONS:-} ${{ matrix.setup_options }}

    - name: Build
      run: |
        cd builddir
        ninja -v
    - name: Test
      run: cd builddir && meson test -v

  macos:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26, macos-26-intel]

    runs-on: ${{ matrix.os }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    needs:
      - build
    steps:
    - uses: actions/checkout@v7
    - name: Cache Homebrew packages
      uses: actions/cache@v6
      with:
        path: ~/Library/Caches/Homebrew
        key: ${{ runner.os }}-${{ matrix.os }}-brew-${{ hashFiles('.github/workflows/c-cpp.yml') }}
        restore-keys: ${{ runner.os }}-${{ matrix.os }}-brew-
    - name: Show info
      run: |
        export -p
        echo '${{ toJSON(matrix) }}'

    - run: |
        brew update
        # The macOS 15 image preinstalls openssl@1.1, which owns
        # /opt/homebrew/bin/openssl and makes an openssl@3 upgrade (pulled in
        # by meson) fail to link.
        brew unlink openssl@1.1 || true
        brew install \
          canfigger \
          gettext \
          glib \
          meson \
          ninja \
          ncurses \
          pkg-config

    - name: Configure
      run: meson setup builddir

    - name: Build
      run: |
        meson compile -v -C builddir

    - name: Test
      run: |
        meson test -v -C builddir

  # Populate the image caches once. Without this every leg of the matrix
  # below would download both images on a cache miss, and all but one would
  # then fail to save them.
  images:
    name: cache-test-images
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Cache btrfs Image
      uses: actions/cache@v6
      id: btrfs-img-cache
      with:
        path: ${{ env.BTRFS_IMG }}
        key: ${{ hashFiles('test/rmw-btrfs-test.img.sha256sum') }}

    - if: ${{ steps.btrfs-img-cache.outputs.cache-hit != 'true' }}
      run: curl -L -o "$BTRFS_IMG" 'https://www.dropbox.com/scl/fi/57g3ixd3w3tuz4qoc2zp1/rmw-btrfs-test.img?rlkey=yc7krtntswsa1bwz0sbugy4gi&st=hkgrht05&dl=0'

    - name: Test btrfs image existence
      run: test -f "$BTRFS_IMG"

    - name: Cache bcachefs Image
      uses: actions/cache@v6
      id: bcachefs-img-cache
      with:
        path: ${{ env.BCACHEFS_IMG }}
        key: ${{ hashFiles('test/rmw-bcachefs-test.img.sha256sum') }}

    - if: ${{ steps.bcachefs-img-cache.outputs.cache-hit != 'true' }}
      run: curl -L -o "$BCACHEFS_IMG" 'https://www.dropbox.com/scl/fi/key20cj08ca9engqt5kzi/rmw-bcachefs-test.img?rlkey=th6zw1ar7t0dy9m7qzah5wvq9&st=nrwczcqn&dl=0'

    - name: Test bcachefs image existence
      run: test -f "$BCACHEFS_IMG"

  various:
    # One configuration per job: each gets a clean runner, so no step can
    # affect another (removing gettext, for one, is destructive).
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs:
      - images
    strategy:
      fail-fast: false
      matrix:
        include:
        # run_cmd defaults to the test suite; set it only where that differs.
        - name: default-config
        - name: without-curses
          setup_options: -Dwithout-curses=true
        - name: without-nls
          setup_options: -Dnls=false
        - name: with-sanitizers
          setup_options: -Db_sanitize=address,undefined -Db_lundef=false
        - name: with-lto-and-fortify
          setup_options: -Db_sanitize=none -Dc_args=-D_FORTIFY_SOURCE=3 -Dbuildtype=debugoptimized -Db_lto=true
        - name: epochalypse
          setup_options: -Db_sanitize=none
          run_cmd: meson test -v -C builddir --setup=epochalypse --suite=rmw
        - name: dist
          run_cmd: meson dist -C builddir --include-subprojects
        - name: dist-without-gettext
          pre_cmd: sudo apt remove -y gettext
          setup_options: -Dnls=false
          run_cmd: meson dist -C builddir --include-subprojects

    steps:
    - uses: actions/checkout@v7

    # Restore only: the images job above already populated these.
    - name: Restore btrfs Image
      uses: actions/cache/restore@v6
      with:
        path: ${{ env.BTRFS_IMG }}
        key: ${{ hashFiles('test/rmw-btrfs-test.img.sha256sum') }}
        fail-on-cache-miss: true

    - name: Restore bcachefs Image
      uses: actions/cache/restore@v6
      with:
        path: ${{ env.BCACHEFS_IMG }}
        key: ${{ hashFiles('test/rmw-bcachefs-test.img.sha256sum') }}
        fail-on-cache-miss: true

    - name: Install Dependencies
      run: |
        sudo apt update
        sudo apt-get install --no-install-recommends -y \
          attr \
          faketime \
          gettext \
          libglib2.0-dev \
          meson \
          ninja-build \
          strace

    - name: Prepare
      if: ${{ matrix.pre_cmd }}
      run: ${{ matrix.pre_cmd }}

    - name: Configure
      run: meson setup builddir ${{ matrix.setup_options }}

    - name: Build
      run: meson compile -C builddir

    - name: Run
      run: ${{ matrix.run_cmd || 'meson test -v -C builddir' }}
